[Manager]
# Apply the presets in /usr/lib/systemd/system-preset/ on every boot. Presets are
# the only way to enable units in an immutable image: `systemctl enable` at build
# time writes into /etc, which in a container image is /usr/etc (usrmerge) and is
# stripped by the final cleanup, so those symlinks do not survive into the boot.
DefaultPresetLevel=1
