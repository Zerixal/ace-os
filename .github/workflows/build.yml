---
name: Build container image

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "05 11 * * *"
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  FEDORA_VERSION: "43"
  DEFAULT_TAG: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Mount BTRFS for container storage
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Get current date
        id: date
        run: echo "short_date=$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

      - name: Set image tags
        id: tags
        run: |
          TAGS="${DEFAULT_TAG} ${DEFAULT_TAG}.${{ steps.date.outputs.short_date }}"
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"
          echo "TAGS=${TAGS}" >> "${GITHUB_ENV}"

      - name: Prepare build args
        run: |
          cat > build_args.txt <<EOF
          FEDORA_VERSION=${FEDORA_VERSION}
          DEFAULT_TAG=${DEFAULT_TAG}
          IMAGE=${IMAGE_NAME}
          EOF

      - name: Build image
        run: |
          sudo buildah bud \
            --build-arg-file build_args.txt \
            --format docker \
            --layers \
            --tag "raw-img" \
            --file Containerfile \
            .

      - name: Run Rechunker
        id: rechunk
        uses: hhd-dev/rechunk@v1.2.4
        with:
          rechunk: "ghcr.io/hhd-dev/rechunk:v1.2.3"
          ref: "raw-img"
          prev-ref: "${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}"
          skip_compression: false
          version: ${{ steps.tags.outputs.tags }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          IMAGE="$(podman pull "${{ steps.rechunk.outputs.ref }}")"
          IMAGE_FULL="${IMAGE_REGISTRY}/${IMAGE_NAME}"

          for tag in ${TAGS}; do
            podman tag "${IMAGE}" "${IMAGE_FULL}:${tag}"
            podman push "${IMAGE_FULL}:${tag}"
          done

      - name: Check signing key
        if: github.event_name != 'pull_request'
        id: signing
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -n "${COSIGN_PRIVATE_KEY}" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Cosign
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign images
        if: github.event_name != 'pull_request' && steps.signing.outputs.enabled == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          set -euo pipefail

          for tag in ${TAGS}; do
            cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
